<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Vault — Prijava</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="brand">
      <span class="brand-icon">🎵</span>
      <h1>Music Vault</h1>
      <p>XML baza glazbene kolekcije</p>
    </div>

    <!-- Alert poruka (greška/uspjeh) -->
    <div id="alert" class="alert alert-error"></div>

    <!-- Login forma -->
    <div class="form-group">
      <label for="username">Korisničko ime</label>
      <input type="text" id="username" placeholder="npr. admin" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">Lozinka</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">
      Prijavi se
    </button>

    <!-- Info box s demo korisnicima -->
    <div style="margin-top: 1.5rem; padding: 12px; background: var(--surface2);
                border-radius: 8px; border: 1px solid var(--border);">
      <p style="font-size: 12px; color: var(--muted); margin-bottom: 8px;">
        🔐 Demo korisnici (iz <code>users.xml</code>):
      </p>
      <p style="font-size: 12px; color: var(--muted);">
        <code>admin</code> / <code>admin123</code>
      </p>
      <p style="font-size: 12px; color: var(--muted);">
        <code>josip</code> / <code>glazba2024</code>
      </p>
    </div>

  </div>
</div>

<script src="app.js"></script>
<script>
  // Ako je već prijavljen, preskoči login
  if (getCurrentUser()) {
    window.location.href = 'dashboard.html';
  }

  // Login handler — čita username/password, poziva app.js authenticate()
  function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const alert    = document.getElementById('alert');

    if (!username || !password) {
      showAlert(alert, 'Unesite korisničko ime i lozinku.');
      return;
    }

    // login() je definiran u app.js — uspoređuje s users.xml
    if (login(username, password)) {
      window.location.href = 'dashboard.html';
    } else {
      showAlert(alert, 'Pogrešno korisničko ime ili lozinka.');
      document.getElementById('password').value = '';
    }
  }

  // Enter tipka za login
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>
</body>
</html>
